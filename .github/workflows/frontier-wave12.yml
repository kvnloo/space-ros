# Fork-only read-only source audit. No upstream writes or production deployment.
# PlasmaPy examples from run 36094415035 are learning-only; see UPSTREAM-GATES.md.
name: Frontier wave 12 evidence

on:
  push:
    branches: [probe/frontier-20-repo-wave1]
    paths:
      - tools/probes/su2_nearfield_trace.py
      - .github/workflows/frontier-wave12.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-wave12-evidence
  cancel-in-progress: false

jobs:
  su2_source_trace:
    if: github.repository == 'kvnloo/space-ros'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out trusted fork tools without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/probes
      - name: Trace nearfield dispatch against a pinned complete checkout
        run: python3 tools/probes/su2_nearfield_trace.py
      - name: Preserve only relevant source and receipts, not the checkout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontier-wave12-su2-dispatch
          path: |
            wave12-results/su2-trace/matches.json
            wave12-results/su2-trace/receipts.json
            wave12-results/su2-trace/source/
          if-no-files-found: warn
          retention-days: 30
