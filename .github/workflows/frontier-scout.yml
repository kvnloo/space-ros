# Fork-only research worker, generated by ChatGPT. Not intended for upstream.
name: Frontier 20-repository scout

on:
  push:
    branches: [probe/frontier-20-repo-wave1]
    paths:
      - tools/probes/frontier_scout.py
      - tools/probes/frontier_manifest.json
      - .github/workflows/frontier-scout.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-20-repository-scout
  cancel-in-progress: false

jobs:
  scout:
    if: github.repository == 'kvnloo/space-ros'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out only the trusted fork scout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/probes
      - name: Check scout logic
        run: python3 tools/probes/frontier_scout.py --self-test
      - name: Collect 40 candidate dossiers with four concurrent readers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/probes/frontier_scout.py
      - name: Preserve raw sources and bounded-read limitations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontier-20-repos-40-lanes
          path: frontier-results/
          if-no-files-found: warn
          retention-days: 30
