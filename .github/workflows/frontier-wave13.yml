# Fork-only evidence, generated by ChatGPT. No upstream writes or deployments.
# OpenMDAO verification reproduces an expected baseline mismatch; it is not a fix.
name: Frontier wave 13 evidence

on:
  push:
    branches: [probe/frontier-20-repo-wave1]
    paths:
      - tools/probes/frontier_wave13.py
      - tools/probes/frontier_wave13_verify.py
      - .github/workflows/frontier-wave13.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-wave13-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: github.repository == 'kvnloo/space-ros'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [su2, openmdao]
    steps:
      - name: Check out trusted evidence tools without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/probes
      - name: Check geometry-auditor controls
        run: python3 tools/probes/frontier_wave13.py --self-test
      - name: Install pinned OpenMDAO source in an isolated environment
        if: matrix.lane == 'openmdao'
        run: |
          git init openmdao-target
          git -C openmdao-target remote add origin https://github.com/OpenMDAO/OpenMDAO.git
          git -C openmdao-target fetch --depth=1 origin 176ac87acb1800fa4e1b5883b4bb73e4890cfe24
          git -C openmdao-target checkout --detach FETCH_HEAD
          python3 -m venv .wave13-venv
          .wave13-venv/bin/python -m pip install -e ./openmdao-target
          mkdir -p wave13-results
          .wave13-venv/bin/python -m pip freeze > wave13-results/dependencies.txt
      - name: Audit pinned SU2 mesh geometry including identity metadata
        if: matrix.lane == 'su2'
        run: python3 tools/probes/frontier_wave13_verify.py su2
      - name: Verify existing OpenMDAO scaling mismatch and current-value controls
        if: matrix.lane == 'openmdao'
        env:
          OPENMDAO_REPORTS: '0'
        run: .wave13-venv/bin/python tools/probes/frontier_wave13_verify.py openmdao
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontier-wave13-${{ matrix.lane }}
          path: wave13-results/
          if-no-files-found: warn
          retention-days: 30
